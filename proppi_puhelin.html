<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Alvina · puhelin">
<meta name="theme-color" content="#0E1116">
<link rel="apple-touch-icon" href="assets/ikoni_puhelin.png">
<link rel="manifest" href="manifest_puhelin.json">
<link rel="stylesheet" href="runko.css">
<link rel="stylesheet" href="glitch.css">
<link rel="stylesheet" href="hopp.css">
<title>GRIND 3 — puhelin</title>
</head>
<body>
<script src="kartta.js"></script>
<script src="glitch.js"></script>
<script src="moottori.js"></script>
<script>
/* Alvinan iPhone autotelineessä — HOPP Partner, kuljettajanäkymä.
 *
 * Rakenne noudattaa kyytisovellusten genrekonventiota: kartta täyttää ruudun,
 * tieto kelluu päällä. Ilme on oma — ei kenenkään tunnusväriä, kirjainmerkkiä
 * eikä painikemuotoa. Ks. BRIEF_GRAAFIKKO.md kohta 8.
 *
 * Kartta on kartta.js. Sitä ei luoda uudelleen cue-vaihdossa vaan sama canvas
 * siirretään cuesta toiseen — muuten tiestö välkähtäisi joka kerta.
 */
(function () {
  var kartta = null, kangas = null;

  /* ── Kartta cueen ────────────────────────────────────────────────────── */
  function karttaan(juuri, ctx, asetukset) {
    if (!kangas) {
      kangas = document.createElement('canvas');
      kangas.className = 'hopp-kartta';
    }
    if (!kartta) {
      var K = ctx.S.hopp.kartta || {};
      kartta = new GRIND.Kartta(kangas, {
        siemen: K.siemen || 3310,
        zoom: K.zoom,
        nopeusKmh: K.nopeusKmh,
        kadut: ctx.S.hopp.kadut,
        varit: ctx.T.kartta || {},
        fontti: 'system-ui, sans-serif'
      });
      kartta.kaanny = K.kaanny !== false;
    }
    juuri.appendChild(kangas);

    var osuudet = (ctx.S.hopp.kartta && ctx.S.hopp.kartta.osuudet) || {};
    if (asetukset.osuus != null) {
      kartta.keskitaAutoon();
      kartta.asetaOsuus(osuudet[asetukset.osuus] != null ? osuudet[asetukset.osuus] : 0.4);
    }
    kartta.liikkuu = !!asetukset.liikkuu;
    kartta.piirra();

    juuri.appendChild(el('hopp-himmennys'));
    return kartta;
  }

  /* Auton nuoli jäi paneelien alle, koska se on kiinteästi 68 % korkeudelta.
     Mitataan päällä olevat kerrokset ja asetetaan nuoli näkyvän kaistan
     alakolmannekseen: edessä oleva reitti näkyy, eikä nuoli piiloudu. */
  function sovitaAuto(d) {
    requestAnimationFrame(function () {
      if (!kartta || !kangas) return;
      var korkeus = kangas.clientHeight || window.innerHeight;
      if (!korkeus) return;

      var yla = 0;
      var y = d.querySelector('.hopp-yla');
      if (y) yla = Math.max(0, y.getBoundingClientRect().bottom);

      var ala = 0;
      var a = d.querySelector('.hopp-ala') || d.querySelector('.hopp-pyynto-kortti');
      if (a) ala = Math.max(0, korkeus - a.getBoundingClientRect().top);

      var nakyva = korkeus - yla - ala;
      if (nakyva < 70) {            // kortti peittää lähes kaiken
        kartta.autoY = Math.max(0.06, (korkeus - ala - 34) / korkeus);
      } else {
        kartta.autoY = (yla + nakyva * 0.62) / korkeus;
      }
      kartta.autoY = Math.min(0.94, Math.max(0.06, kartta.autoY));
      kartta.piirra();
    });
  }

  function kuori(juuri) {
    var d = document.createElement('div');
    d.className = 'hopp';
    juuri.appendChild(d);
    return d;
  }

  function el(luokka, sisus) {
    var d = document.createElement('div');
    d.className = luokka;
    if (sisus != null) d.innerHTML = sisus;
    return d;
  }

  /* Matkan pituus tulee sisalto.json:in luvusta, ja jäljellä oleva matka
     lasketaan siitä reitin osuudella. Generoidun reitin todellinen pituus on
     eri — jos lukema tulisi siitä, se hyppäisi kesken oton. */
  function matkaTeksti(ctx) {
    return ctx.e2(ctx.S.hopp.matkanPituusKm) + ' km';
  }
  function noutoTeksti(ctx) {
    return ctx.e2(ctx.S.hopp.noutoEtaisyysKm) + ' km';
  }
  function jaljellaTeksti(ctx) {
    var osuus = kartta ? Math.max(0, 1 - kartta.matka / kartta.reitinPituus) : 1;
    var km = ctx.S.hopp.matkanPituusKm * osuus;
    return km >= 0.95 ? ctx.e2(km) + ' km' : Math.round(km * 1000 / 10) * 10 + ' m';
  }

  function nappi(teksti, luokka, kasittele) {
    var b = document.createElement('button');
    b.className = 'hopp-nappi' + (luokka ? ' ' + luokka : '');
    b.textContent = teksti;
    if (kasittele) b.addEventListener('click', kasittele);
    return b;
  }

  var NUOLI_OIKEA  = '<svg class="hopp-nuoli" viewBox="0 0 24 24"><path d="M9 21V12.5c0-1.9 1.6-3.5 3.5-3.5H17l-3.3-3.3 1.4-1.4L21.4 10l-6.3 6.3-1.4-1.4L17 11.5h-4.5c-.8 0-1.5.7-1.5 1.5V21H9z"/></svg>';
  var NUOLI_YMPARI = '<svg class="hopp-nuoli" viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7c3.3 0 6 2.7 6 6s-2.7 6-6 6-6-2.7-6-6H4c0 4.4 3.6 8 8 8s8-3.6 8-8-3.6-8-8-8z"/></svg>';
  var RUKSI        = '<svg class="hopp-nuoli" viewBox="0 0 24 24"><path d="M9.6 16.2 4.8 11.4l-1.4 1.4 6.2 6.2L21 7.6l-1.4-1.4z"/></svg>';

  /* ── Osat ────────────────────────────────────────────────────────────── */
  function tilapalkki(ctx) {
    var y = el('hopp-yla');
    y.appendChild(el('hopp-tila',
      '<div class="hopp-piste"></div>' +
      '<b>' + ctx.nimi('hopp') + '</b>' +
      '<span style="color:var(--himmea);font-size:13px">' + ctx.S.hopp.otsikko + '</span>' +
      '<span class="hopp-ansiot">' + ctx.e2(ctx.S.luvut.ansiot) + ' €</span>'));
    return y;
  }

  function osoiterivit(ctx, korostaMaara) {
    var H = ctx.S.hopp;
    return el('hopp-osoite',
      '<div class="hopp-osoite-merkit"><div class="hopp-piste-nouto"></div>' +
      '<div class="hopp-viiva-pysty"></div><div class="hopp-piste-maara"></div></div>' +
      '<div class="hopp-osoite-rivit">' +
      '<div class="hopp-osoite-rivi' + (korostaMaara ? ' hopp-himmea' : '') + '">' + H.noutopaikka + '</div>' +
      '<div class="hopp-osoite-rivi' + (korostaMaara ? '' : ' hopp-himmea') + '">' + H.maaranpaa + '</div></div>');
  }

  /* Ajastinrengas. Sykkii ja laskee sekunteja — se on kohtauksen paine. */
  var KEHA = 2 * Math.PI * 29;
  function rengas(sekunnit) {
    return el('hopp-rengas',
      '<svg viewBox="0 0 66 66">' +
      '<circle class="hopp-rengas-tausta" cx="33" cy="33" r="29"></circle>' +
      '<circle class="hopp-rengas-kaari" cx="33" cy="33" r="29" ' +
      'stroke-dasharray="' + KEHA.toFixed(1) + '" stroke-dashoffset="0"></circle>' +
      '</svg><div class="hopp-rengas-luku">' + sekunnit + '</div>');
  }

  /* Ajastin laskee cue-suhteellisesta ajasta, joten se on joka otossa sama. */
  function paivitaRengas(juuri, alku, kulunut) {
    var r = juuri.querySelector('.hopp-rengas');
    if (!r) return;
    var jaljella = Math.max(0, alku - Math.floor(kulunut));
    r.querySelector('.hopp-rengas-luku').textContent = jaljella;
    r.querySelector('.hopp-rengas-kaari').style.strokeDashoffset =
      (KEHA * (1 - jaljella / alku)).toFixed(1);
    r.classList.toggle('hopp-kiire', jaljella <= 10);
  }

  /* ── Kyytipyyntö ─────────────────────────────────────────────────────────
     HYVÄKSY vaihtaa kortin vahvistukseksi, kuten kyytisovelluksissa: pyyntö
     katoaa ja tilalle tulee "matkalla noutopaikkaan". Se jää ruudulle —
     cue vaihdetaan klikkerillä, ei näyttelijän painalluksesta. */
  function pyyntoKortti(ctx) {
    var H = ctx.S.hopp, L = ctx.S.luvut;
    var p = el('hopp-pyynto');
    var k = el('hopp-pyynto-kortti');

    var ylin = el('hopp-pyynto-ylin',
      '<div><div class="hopp-tuotto">' + ctx.e2(L.provikka) + ' €</div>' +
      '<div class="hopp-tuotto-selite">' + H.ennusteOtsikko + '</div></div>');
    ylin.appendChild(rengas(L.ajastinSekunnit));
    k.appendChild(ylin);

    k.appendChild(el('hopp-pyynto-tiedot',
      '<div class="hopp-pyynto-tieto"><span>' + H.etaisyysOtsikko + '</span><b>' + noutoTeksti(ctx) + '</b></div>' +
      '<div class="hopp-pyynto-tieto"><span>Matka</span><b>' + matkaTeksti(ctx) + '</b></div>' +
      '<div class="hopp-pyynto-tieto"><span>Kesto</span><b>' + H.matkanKesto + '</b></div>'));

    k.appendChild(osoiterivit(ctx, false));

    k.appendChild(nappi(H.hyvaksyNappi, null, function () {
      naytaVahvistus(p, ctx);
    }));
    k.appendChild(nappi(H.hylkaaNappi, 'hopp-toissijainen'));

    p.appendChild(k);
    return p;
  }

  function naytaVahvistus(pyynto, ctx) {
    var H = ctx.S.hopp;
    pyynto.classList.add('hopp-vahvistettu');
    pyynto.innerHTML = '';

    var k = el('hopp-pyynto-kortti hopp-vahvistus');
    k.appendChild(el('hopp-vahvistus-ylin',
      '<div class="hopp-vahvistus-merkki">' + RUKSI + '</div>' +
      '<div><div class="hopp-vahvistus-otsikko">' + H.hyvaksyttyOtsikko + '</div>' +
      '<div class="hopp-vahvistus-teksti">' + H.hyvaksyttyTeksti + '</div></div>'));

    k.appendChild(el('hopp-pyynto-tiedot',
      '<div class="hopp-pyynto-tieto"><span>' + H.saavuOtsikko + '</span><b>' + noutoTeksti(ctx) + '</b></div>' +
      '<div class="hopp-pyynto-tieto"><span>Kesto</span><b>' + H.matkanKesto + '</b></div>' +
      '<div class="hopp-pyynto-tieto"><span>Perillä</span><b>' + H.saapumisaika + '</b></div>'));

    k.appendChild(osoiterivit(ctx, false));
    pyynto.appendChild(k);
    sovitaAuto(pyynto.parentNode || pyynto);
  }

  /* ── Navigointi ──────────────────────────────────────────────────────────
     START RIDE piilottaa alapaneelin ja aloittaa navigoinnin: käännösohje
     ylös, kartta liikkeelle. */
  function ohjepalkki(ctx, ohje, hatatila) {
    var y = el('hopp-yla');
    y.appendChild(el('hopp-ohje' + (hatatila ? ' hopp-hatatila' : ''),
      (hatatila ? NUOLI_YMPARI : NUOLI_OIKEA) +
      '<div><div class="hopp-ohje-matka" id="hopp-matka">' + ohje.matka + '</div>' +
      '<div class="hopp-ohje-teksti">' + ohje.teksti + '</div></div>'));
    return y;
  }

  function ajopaneeli(ctx) {
    var H = ctx.S.hopp;
    var a = el('hopp-ala');
    var p = el('hopp-paneeli');
    p.appendChild(el('hopp-luvut',
      '<div class="hopp-luku"><span>Perillä</span><b>' + H.saapumisaika + '</b></div>' +
      '<div class="hopp-luku"><span>Jäljellä</span><b id="hopp-jaljella">' + matkaTeksti(ctx) + '</b></div>' +
      '<div class="hopp-luku"><span>Nopeus</span><b id="hopp-nopeus">–</b></div>'));
    a.appendChild(p);
    return a;
  }

  function aloitaNavigointi(d, ctx) {
    var vanha = d.querySelector('.hopp-ala');
    if (vanha) vanha.remove();
    var yla = d.querySelector('.hopp-yla');
    if (yla) yla.remove();

    d.appendChild(ohjepalkki(ctx, ctx.S.hopp.ohjeet[0]));
    d.appendChild(ajopaneeli(ctx));
    if (kartta) kartta.liikkuu = true;
    sovitaAuto(d);
  }

  /* Yhteinen ajon aikainen päivitys cueille 2 ja 3. */
  function ajoTick(cue, juuri, ctx) {
    if (!kartta || !kartta.liikkuu) return;
    var dt = Math.min(0.1, ctx.t - (cue._edellinen || ctx.t));
    cue._edellinen = ctx.t;
    kartta.etene(dt);
    kartta.piirra();

    var m = juuri.querySelector('#hopp-jaljella');
    if (m) m.textContent = jaljellaTeksti(ctx);
    var n = juuri.querySelector('#hopp-nopeus');
    if (n) n.textContent = Math.round(kartta.nopeus * 3.6) + ' km/h';
    var e = juuri.querySelector('#hopp-matka');
    if (e) {
      var seuraava = Math.max(0, 400 - (kartta.matka % 400));
      e.textContent = seuraava > 950
        ? ctx.e1(seuraava / 1000) + ' km' : Math.round(seuraava / 10) * 10 + ' m';
    }
  }

  /* ── Operaattorin karttatyökalu ──────────────────────────────────────── */
  function karttatyokalu(juuri) {
    var t = el('hopp-karttatyokalu');
    t.innerHTML =
      '<div class="hopp-tt-rivi"><span>KARTTA</span><b id="hopp-tt-tila">–</b></div>' +
      '<div class="hopp-tt-rivi"><span>siemen</span><b id="hopp-tt-siemen">–</b></div>' +
      '<div class="hopp-tt-rivi"><span>zoom</span><b id="hopp-tt-zoom">–</b></div>' +
      '<div class="hopp-tt-rivi"><span>nopeus</span><b id="hopp-tt-nopeus">–</b></div>' +
      '<div style="color:var(--himmea-2);line-height:1.6;margin-top:3px">' +
      'W A S D siirrä · Q E zoom<br>C keskitä · K käännä<br>' +
      'F nopeampi · J jarru<br>N uusi kaupunki · M tallenna<br>L paikannin</div>';
    juuri.appendChild(t);
    paivitaTyokalu();
    return t;
  }

  function paivitaTyokalu() {
    if (!kartta) return;
    var a = document.getElementById('hopp-tt-tila');
    if (!a) return;
    a.textContent = kartta.gps ? 'paikannin' : (kartta.vapaa ? 'siirretty' : 'auto');
    document.getElementById('hopp-tt-siemen').textContent = kartta.asetukset.siemen;
    document.getElementById('hopp-tt-zoom').textContent = kartta.zoom.toFixed(2);
    document.getElementById('hopp-tt-nopeus').textContent = Math.round(kartta.nopeus * 3.6) + ' km/h';
  }

  /* ══ Cuet ═══════════════════════════════════════════════════════════════ */
  GRIND.kaynnista({
    laite: 'puhelin',
    cuet: function (M) { return [

      /* 0 — Vuoroloki. 18 tuntia ajossa, tauko ylitetty. */
      { id: 0, nimi: 'Vuoroloki', sovellus: 'hopp',
        piirra: function (juuri, ctx) {
          var d = kuori(juuri);
          karttaan(d, ctx, { osuus: 'nouto' });
          d.appendChild(tilapalkki(ctx));
          karttatyokalu(d);

          var H = ctx.S.hopp, L = ctx.S.luvut;
          var a = el('hopp-ala');
          var p = el('hopp-paneeli');
          p.appendChild(el('hopp-kahva'));
          p.appendChild(el('hopp-otsikko', H.vuoroOtsikko));
          p.appendChild(el('hopp-vuoro',
            '<div class="hopp-vuoro-luku">' + L.vuoroTunnit + '</div>' +
            '<div class="hopp-vuoro-min">h ' + L.vuoroMinuutit + ' min</div>'));
          p.appendChild(el('hopp-luvut',
            '<div class="hopp-luku"><span>' + H.ansiotOtsikko + '</span><b>' +
              ctx.e2(L.ansiot) + ' €</b></div>' +
            '<div class="hopp-luku"><span>' + H.kyyditOtsikko + '</span><b>' + L.kyydit + '</b></div>' +
            '<div class="hopp-luku"><span>' + H.hyvaksyntaOtsikko + '</span><b>' +
              ctx.e1(L.hyvaksymisprosentti) + ' %</b></div>'));
          p.appendChild(el('hopp-varoitus', '<span>⚠</span><span>' + H.taukoVaroitus + '</span>'));
          a.appendChild(p);
          d.appendChild(a);
          sovitaAuto(d);
        } },

      /* 1 — Ruutu räpsyy, hyväksymisajastin sykkii. Alvina painaa HYVÄKSY.
             Räpsähtely käynnistyy itsestään: kuvauspaikalla operaattorilla on
             vain klikkeri, joten sitä ei voi painaa käsin. */
      { id: 1, nimi: 'Räpsy + ajastin', sovellus: 'hopp',
        kosketus: true,
        piirra: function (juuri, ctx) {
          var d = kuori(juuri);
          karttaan(d, ctx, { osuus: 'nouto' });
          d.appendChild(tilapalkki(ctx));
          karttatyokalu(d);
          d.appendChild(pyyntoKortti(ctx));
          sovitaAuto(d);
          GRIND.glitch.automaatti(ctx.S.hopp.rapsy);
        },
        tick: function (juuri, ctx) { paivitaRengas(juuri, ctx.S.luvut.ajastinSekunnit, ctx.t); } },

      /* 2 — Matkustaja kyydissä. START RIDE piilottaa paneelin ja aloittaa
             navigoinnin. Alvina painaa itse. */
      { id: 2, nimi: 'START RIDE', sovellus: 'hopp',
        kosketus: true,
        piirra: function (juuri, ctx) {
          var cue = this;
          cue._edellinen = 0;
          var d = kuori(juuri);
          karttaan(d, ctx, { osuus: 'nouto' });
          d.appendChild(tilapalkki(ctx));
          karttatyokalu(d);

          var H = ctx.S.hopp;
          var a = el('hopp-ala');
          var p = el('hopp-paneeli');
          p.appendChild(el('hopp-kahva'));
          p.appendChild(el('hopp-otsikko', H.matkustaja));
          p.appendChild(el('hopp-luvut',
            '<div class="hopp-luku"><span>Matka</span><b>' + matkaTeksti(ctx) + '</b></div>' +
            '<div class="hopp-luku"><span>Kesto</span><b>' + H.matkanKesto + '</b></div>' +
            '<div class="hopp-luku"><span>Perillä</span><b>' + H.saapumisaika + '</b></div>'));
          p.appendChild(osoiterivit(ctx, true));
          p.appendChild(nappi(H.aloitaNappi, null, function () { aloitaNavigointi(d, ctx); }));
          a.appendChild(p);
          d.appendChild(a);
          sovitaAuto(d);
        },
        tick: function (juuri, ctx) { ajoTick(this, juuri, ctx); } },

      /* 3 — Ajossa. Kartta liikkuu ja reittiviiva etenee. */
      { id: 3, nimi: 'Ajossa', sovellus: 'hopp',
        piirra: function (juuri, ctx) {
          var cue = this;
          cue._edellinen = 0;
          var d = kuori(juuri);
          karttaan(d, ctx, { osuus: 'ajossa', liikkuu: true });
          karttatyokalu(d);
          d.appendChild(ohjepalkki(ctx, ctx.S.hopp.ohjeet[0]));
          d.appendChild(ajopaneeli(ctx));
          sovitaAuto(d);
        },
        tick: function (juuri, ctx) { ajoTick(this, juuri, ctx); } },

      /* 4 — Metsätie. Reitti ei ole enää käytettävissä. */
      { id: 4, nimi: 'KÄÄNNY YMPÄRI', sovellus: 'hopp',
        hohto: { vari: 'punainen', voima: 3 },
        piirra: function (juuri, ctx) {
          var d = kuori(juuri);
          karttaan(d, ctx, { osuus: 'metsatie' });
          karttatyokalu(d);
          var H = ctx.S.hopp;
          d.appendChild(ohjepalkki(ctx,
            { matka: H.kaannyNappi, teksti: H.ohjeet[H.ohjeet.length - 1].teksti }, true));
          sovitaAuto(d);
        } },

      /* 5 — Uusi kyyti lähellä. Alvina painaa HYVÄKSY. */
      { id: 5, nimi: 'Uusi kyyti', sovellus: 'hopp',
        kosketus: true,
        piirra: function (juuri, ctx) {
          var d = kuori(juuri);
          karttaan(d, ctx, { osuus: 'metsatie' });
          d.appendChild(tilapalkki(ctx));
          karttatyokalu(d);
          d.appendChild(pyyntoKortti(ctx));
          sovitaAuto(d);
        },
        tick: function (juuri, ctx) { paivitaRengas(juuri, ctx.S.luvut.ajastinSekunnit, ctx.t); } },

      { id: 6, nimi: 'Kameratesti', piirra: M.testikortti() }

    ]; }
  }).then(function () {
    /* ── Operaattorin karttanäppäimet ──────────────────────────────────────
       Moottori jättää tuntemattomat näppäimet käsittelemättä, joten nämä
       tulevat sen päälle. G X Y Z ovat glitchille, joten paikannin on L. */
    window.addEventListener('keydown', function (t) {
      if (!kartta || t.metaKey || t.ctrlKey || t.altKey) return;
      var n = t.key.toLowerCase(), askel = 70, kasitelty = true;
      switch (n) {
        case 'w': kartta.siirra(0, -askel); break;
        case 's': kartta.siirra(0, askel); break;
        case 'a': kartta.siirra(-askel, 0); break;
        case 'd': kartta.siirra(askel, 0); break;
        case 'q': kartta.zoom = Math.max(0.04, kartta.zoom / 1.3); break;
        case 'e': kartta.zoom = Math.min(4, kartta.zoom * 1.3); break;
        case 'c': kartta.keskitaAutoon(); break;
        case 'k': kartta.kaanny = !kartta.kaanny; break;
        case 'f': asetaNopeus(kartta.nopeus * 3.6 + 6); break;
        case 'j': asetaNopeus(kartta.nopeus * 3.6 - 6); break;
        case 'n': uusiKaupunki(); break;
        case 'm': tallennaNakyma(); break;
        case 'l': paikannin(); break;
        default: kasitelty = false;
      }
      if (!kasitelty) return;
      t.preventDefault();
      kartta.piirra();
      paivitaTyokalu();
    });
  });

  function asetaNopeus(kmh) {
    kartta.nopeus = Math.max(0, Math.min(160, kmh)) / 3.6;
    GRIND.ilmoita('nopeus ' + Math.round(kartta.nopeus * 3.6) + ' km/h');
  }

  /* Uusi siemen = uusi kaupunki samalla tyylillä. Jatkuvuuden takia siemen
     pitää kirjata sisalto.json:iin, kun oikea löytyy. */
  function uusiKaupunki() {
    var vanha = kartta.asetukset;
    var uusi = Math.floor(Math.random() * 99999);
    kartta = new GRIND.Kartta(kangas, {
      siemen: uusi, zoom: kartta.zoom, nopeusKmh: vanha.nopeusKmh,
      kadut: vanha.kadut, varit: vanha.varit, fontti: vanha.fontti
    });
    GRIND.ilmoita('siemen ' + uusi);
  }

  /* Tallentaa nykyisen näkymän laitteeseen ja tulostaa sen konsoliin
     muodossa, jonka voi kopioida suoraan sisalto.json:iin. */
  function tallennaNakyma() {
    var n = {
      siemen: kartta.asetukset.siemen,
      zoom: Number(kartta.zoom.toFixed(3)),
      keskus: [Math.round(kartta.keskus.x), Math.round(kartta.keskus.y)],
      osuus: Number((kartta.matka / kartta.reitinPituus).toFixed(3)),
      tallennettu: new Date().toISOString().slice(0, 16)
    };
    var lista = [];
    try { lista = JSON.parse(localStorage.getItem('grind3-kartat') || '[]'); } catch (e) {}
    lista.push(n);
    try { localStorage.setItem('grind3-kartat', JSON.stringify(lista)); } catch (e) {}
    console.log('Kopioi sisalto.json → hopp.kartta.nakymat:\n' + JSON.stringify(lista, null, 2));
    GRIND.ilmoita('näkymä tallennettu · siemen ' + n.siemen + ' · ' + lista.length + ' kpl');
  }

  /* Paikannin antaa vain nopeuden, ei sijaintia. Kartan tiestö on
     fiktiivinen, joten ei ole paikkaa johon paikantaa — mutta kartan
     kannattaa liikkua samaa vauhtia kuin auto ikkunan takana. */
  function paikannin() {
    var paalle = !kartta.gpsVahti;
    kartta.seuraaNopeus(paalle, function (viesti) {
      GRIND.ilmoita(viesti);
      paivitaTyokalu();
    });
  }
})();
</script>
</body>
</html>
