<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Alvina · puhelin">
<meta name="theme-color" content="#2E2E2E">
<link rel="apple-touch-icon" href="assets/ikoni_puhelin.png">
<link rel="manifest" href="manifest_puhelin.json">
<link rel="stylesheet" href="runko.css">
<link rel="stylesheet" href="glitch.css">
<link rel="stylesheet" href="rydez.css">
<title>GRIND 3 — puhelin</title>
</head>
<body>
<script src="kartta.js"></script>
<script src="glitch.js"></script>
<script src="moottori.js"></script>
<script>
/* Alvinan iPhone autotelineessä — RYDEZ, kuljettajanäkymä.
 *
 * Ilme tulee graafikon liikevideosta (Rydez-app-motion.mp4) ja sisältö
 * grafiikkapurusta:
 *
 *   purku 5   Kuskin tilausnäkymä. Työaikaloki laskee hh:mm:ss, yli 18 h.
 *   purku 5A  Tarjouksia hyppii näytölle. Ajastin antaa vain pari sekuntia
 *             aikaa hyväksyä ennen kuin tarjous häviää ja tilalle tulee toinen.
 *   purku 5B  Hyväksytty tilaus ja suuri START RIDE -painike.
 *   purku 6   Ajon aikana seuraillaan reittiä. Määränpäätä ei näy.
 *   purku 6b  Signaali katoaa. Vain punaisella ohje: KÄÄNNY YMPÄRI.
 *
 * Ei ylä-appbaria — videossa on vain kartta ja kortit. Kartta on kartta.js,
 * jonka Rydez-paletti (kelta-oranssi reitti, oranssi autosprite) tulee
 * teema.json:ista.
 */
(function () {
  var kartta = null, kangas = null;

  function el(luokka, sisus) {
    var d = document.createElement('div');
    d.className = luokka;
    if (sisus != null) d.innerHTML = sisus;
    return d;
  }

  function nappi(teksti, luokka, kasittele) {
    var b = document.createElement('button');
    b.className = 'rydez-nappi' + (luokka ? ' ' + luokka : '');
    b.textContent = teksti;
    if (kasittele) b.addEventListener('click', kasittele);
    return b;
  }

  var RUKSI = '<svg viewBox="0 0 24 24"><path d="M9.6 16.2 4.8 11.4l-1.4 1.4 6.2 6.2L21 7.6l-1.4-1.4z"/></svg>';

  /* ── Kartta cueen ────────────────────────────────────────────────────── */
  function karttaan(juuri, ctx, asetukset) {
    if (!kangas) {
      kangas = document.createElement('canvas');
      kangas.className = 'rydez-kartta';
    }
    if (!kartta) {
      var K = ctx.S.hopp.kartta || {};
      kartta = new GRIND.Kartta(kangas, {
        siemen: K.siemen || 3310,
        zoom: K.zoom,
        nopeusKmh: K.nopeusKmh,
        kadut: ctx.S.hopp.kadut,
        varit: ctx.T.kartta || {},
        fontti: 'system-ui, sans-serif'
      });
      kartta.kaanny = K.kaanny !== false;
      GRIND.kartta = kartta;
    }
    juuri.appendChild(kangas);
    kartta.tolpanNimi = ctx.S.hopp.taksitolppa;

    kartta.pysakoity = !!asetukset.pysakoity;
    kartta.naytaReitti = asetukset.naytaReitti !== false;
    kartta.signaaliKadonnut = !!asetukset.signaali;
    kartta.keskitaAutoon();

    if (asetukset.reitti) kartta.asetaReitti(asetukset.reitti);

    var osuudet = (ctx.S.hopp.kartta && ctx.S.hopp.kartta.osuudet) || {};
    if (!asetukset.pysakoity && asetukset.osuus != null) {
      kartta.asetaOsuus(osuudet[asetukset.osuus] != null ? osuudet[asetukset.osuus] : 0.4);
    }
    kartta.liikkuu = !!asetukset.liikkuu;
    kartta.piirra();

    juuri.appendChild(el('rydez-himmennys'));
    return kartta;
  }

  /* Auton nuoli paneelien yläpuolelle: mitataan päällä olevat kerrokset ja
     asetetaan sprite näkyvän kaistan alakolmannekseen. */
  function sovitaAuto(d) {
    requestAnimationFrame(sovita);
    setTimeout(sovita, 140);
    function sovita() {
      if (!kartta || !kangas) return;
      var korkeus = kangas.clientHeight || window.innerHeight;
      if (!korkeus) return;
      var yla = 0;
      var y = d.querySelector('.rydez-yla');
      if (y) yla = Math.max(0, y.getBoundingClientRect().bottom);
      var ala = 0;
      var a = d.querySelector('.rydez-ala');
      if (a && a.firstElementChild) {
        ala = Math.max(0, korkeus - a.firstElementChild.getBoundingClientRect().top);
      }
      var nakyva = korkeus - yla - ala;
      if (nakyva < 70) kartta.autoY = Math.max(0.06, (korkeus - ala - 34) / korkeus);
      else kartta.autoY = (yla + nakyva * 0.62) / korkeus;
      kartta.autoY = Math.min(0.94, Math.max(0.06, kartta.autoY));
      kartta.piirra();
    }
  }

  function kuori(juuri) {
    var d = el('rydez');
    juuri.appendChild(d);
    return d;
  }

  /* ── Osat ────────────────────────────────────────────────────────────── */

  function sanamerkki(ctx) {
    return '<span class="rydez-merkki"><i>R</i>' + ctx.nimi('hopp') + '</span>';
  }

  /* Työaikaloki, purku 5: hh:mm:ss ja sekunnit juoksevat. Tunnit ja
     minuutit ovat jäädytetyt (18:31) — sama jatkuvuusperiaate kuin kellossa. */
  function lokiTeksti(ctx) {
    var L = ctx.S.luvut;
    var hh = (L.vuoroTunnit < 10 ? '0' : '') + L.vuoroTunnit;
    var mm = (L.vuoroMinuutit < 10 ? '0' : '') + L.vuoroMinuutit;
    return hh + ':' + mm + ':<small>' + ctx.kello().sekunnit + '</small>';
  }

  function tilauskortti(ctx) {
    var H = ctx.S.hopp, L = ctx.S.luvut;
    var k = el('rydez-kortti');
    k.appendChild(el('rydez-ylarivi',
      '<span class="rydez-alaotsikko">' + H.lokiOtsikko + '</span>' + sanamerkki(ctx)));
    k.appendChild(el('rydez-loki', lokiTeksti(ctx)));
    k.appendChild(el('rydez-rivi',
      '<div class="rydez-solu"><span>' + H.ansiotOtsikko + '</span><b>' + ctx.e2(L.ansiot) + ' €</b></div>' +
      '<div class="rydez-solu"><span>' + H.kyyditOtsikko + '</span><b>' + L.kyydit + '</b></div>' +
      '<div class="rydez-solu"><span>' + H.hyvaksyntaOtsikko + '</span><b>' + ctx.e1(L.hyvaksymisprosentti) + ' %</b></div>'));
    return k;
  }

  function paivitaLoki(juuri, ctx) {
    var l = juuri.querySelector('.rydez-loki');
    if (l) l.innerHTML = lokiTeksti(ctx);
  }

  /* Kyytitarjous, purku 5A. Ajastinpalkki valuu tyhjiin. */
  function tarjousKortti(ctx, tarjous, kestoS) {
    var H = ctx.S.hopp;
    var k = el('rydez-tarjous');
    k.appendChild(el('rydez-ajastinpalkki', '<i></i>'));
    var sisus = el('rydez-tarjous-sisus');
    sisus.appendChild(el('rydez-alaotsikko', H.tarjousOtsikko));
    sisus.appendChild(el('rydez-tarjous-yla',
      '<div class="rydez-summa">' + ctx.e2(tarjous.summa) + ' €</div>' +
      '<div class="rydez-sekunnit">' + Math.ceil(kestoS) + '</div>'));
    sisus.appendChild(el('rydez-rivi',
      '<div class="rydez-solu"><span>' + H.noutoOtsikko + '</span><b>' + tarjous.nouto + '</b></div>' +
      '<div class="rydez-solu"><span>' + H.matkaOtsikko + '</span><b>' + tarjous.matka + '</b></div>'));
    var napit = el('rydez-napit');
    napit.appendChild(nappi(H.hyvaksyNappi, null, function () {
      k.dispatchEvent(new CustomEvent('hyvaksytty', { bubbles: true }));
    }));
    napit.appendChild(nappi(H.hylkaaNappi, 'haamu'));
    sisus.appendChild(napit);
    k.appendChild(sisus);
    return k;
  }

  function paivitaTarjousAika(kortti, jaljellaS, kestoS) {
    var palkki = kortti.querySelector('.rydez-ajastinpalkki');
    var osuus = Math.max(0, jaljellaS / kestoS);
    palkki.querySelector('i').style.transform = 'scaleX(' + osuus.toFixed(3) + ')';
    palkki.classList.toggle('kiire', jaljellaS <= 1);
    var s = kortti.querySelector('.rydez-sekunnit');
    s.textContent = Math.max(0, Math.ceil(jaljellaS));
    s.classList.toggle('kiire', jaljellaS <= 1);
  }

  /* Vahvistus HYVÄKSY-painalluksen jälkeen. Jää ruudulle — cue vaihdetaan
     klikkerillä. */
  function vahvistusKortti(ctx) {
    var H = ctx.S.hopp;
    var k = el('rydez-kortti');
    k.appendChild(el('rydez-kuittaus',
      '<span class="rydez-kuittaus-merkki">' + RUKSI + '</span>' +
      '<div><div class="rydez-otsikko">' + H.hyvaksyttyOtsikko + '</div>' +
      '<div class="rydez-alaotsikko" style="margin:4px 0 0">' + H.hyvaksyttyTeksti + '</div></div>'));
    k.appendChild(el('rydez-osoite', '<i></i><span>' + H.noutopaikka + '</span>'));
    return k;
  }

  /* ── Cuet ────────────────────────────────────────────────────────────── */
  GRIND.kaynnista({
    laite: 'puhelin',
    cuet: function (M) { return [

      /* 0 — Tilausnäkymä (purku 5). Tolpalla, työaikaloki juoksee. */
      { id: 0, nimi: 'Tilausnäkymä', sovellus: 'hopp',
        piirra: function (juuri, ctx) {
          var d = kuori(juuri);
          karttaan(d, ctx, { pysakoity: true, naytaReitti: false });
          tyokalu(d);
          var a = el('rydez-ala');
          a.appendChild(tilauskortti(ctx));
          d.appendChild(a);
          sovitaAuto(d);
        },
        tick: function (juuri, ctx) { paivitaLoki(juuri, ctx); } },

      /* 1 — Tarjoukset hyppivät (purku 5A). Räpsy päällä. Jokainen tarjous
             elää tarjousKesto sekuntia ja vaihtuu seuraavaan; kierto on
             deterministinen cue-ajasta, joten otto toistuu samanlaisena.
             Alvina voi painaa HYVÄKSY → vahvistus ja noutoreitti käyntiin. */
      { id: 1, nimi: 'Tarjoukset', sovellus: 'hopp',
        kosketus: true,
        piirra: function (juuri, ctx) {
          var cue = this;
          cue._indeksi = -1;
          cue._hyvaksytty = false;
          var d = kuori(juuri);
          karttaan(d, ctx, { pysakoity: true, naytaReitti: false });
          tyokalu(d);
          var a = el('rydez-ala');
          a.appendChild(tilauskortti(ctx));
          d.appendChild(a);
          sovitaAuto(d);

          d.addEventListener('hyvaksytty', function () {
            cue._hyvaksytty = true;
            var vanha = d.querySelector('.rydez-tarjous');
            if (vanha) vanha.remove();
            var ala = d.querySelector('.rydez-ala');
            ala.insertBefore(vahvistusKortti(ctx), ala.firstChild);
            if (kartta) {
              kartta.pysakoity = false;
              kartta.naytaReitti = true;
              kartta.asetaReitti('nouto');
              kartta.liikkuu = true;
            }
            sovitaAuto(d);
          });

          GRIND.glitch.automaatti({ tyypit: ['tear', 'comb', 'block'], valiMin: 1600, valiMax: 4600 });
        },
        tick: function (juuri, ctx) {
          paivitaLoki(juuri, ctx);
          var cue = this;

          if (cue._hyvaksytty) {
            if (kartta && kartta.liikkuu) {
              var dt = Math.min(0.1, ctx.t - (cue._edellinen || ctx.t));
              cue._edellinen = ctx.t;
              kartta.etene(dt);
              kartta.piirra();
            }
            return;
          }

          var H = ctx.S.hopp;
          var kesto = H.tarjousKesto || 3.31;
          var indeksi = Math.floor(ctx.t / kesto) % H.tarjoukset.length;
          var jaljella = kesto - (ctx.t % kesto);

          if (indeksi !== cue._indeksi) {
            cue._indeksi = indeksi;
            var vanha = juuri.querySelector('.rydez-tarjous');
            if (vanha) vanha.remove();
            var ala = juuri.querySelector('.rydez-ala');
            ala.insertBefore(tarjousKortti(ctx, H.tarjoukset[indeksi], kesto), ala.firstChild);
            sovitaAuto(juuri.querySelector('.rydez'));
          }
          var kortti = juuri.querySelector('.rydez-tarjous');
          if (kortti) paivitaTarjousAika(kortti, jaljella, kesto);
        } },

      /* 2 — Hyväksytty tilaus ja suuri START RIDE (purku 5B). */
      { id: 2, nimi: 'START RIDE', sovellus: 'hopp',
        kosketus: true,
        piirra: function (juuri, ctx) {
          var cue = this;
          cue._edellinen = 0;
          var d = kuori(juuri);
          karttaan(d, ctx, { reitti: 'matka', osuus: 0, naytaReitti: true });
          tyokalu(d);

          var H = ctx.S.hopp;
          var a = el('rydez-ala');
          var k = el('rydez-kortti');
          k.appendChild(el('rydez-ylarivi',
            '<span class="rydez-alaotsikko">' + H.matkustaja + '</span>' + sanamerkki(ctx)));
          k.appendChild(el('rydez-osoite', '<i></i><span>' + H.noutopaikka + '</span>'));
          var napit = el('rydez-napit');
          napit.appendChild(nappi(H.aloitaNappi, 'iso', function () {
            /* START RIDE piilottaa kortin ja aloittaa ajon (purku 6). */
            a.innerHTML = '';
            a.appendChild(ajokortti(ctx));
            if (kartta) kartta.liikkuu = true;
            sovitaAuto(d);
          }));
          k.appendChild(napit);
          a.appendChild(k);
          d.appendChild(a);
          sovitaAuto(d);
        },
        tick: function (juuri, ctx) {
          if (!kartta || !kartta.liikkuu) return;
          var cue = this;
          var dt = Math.min(0.1, ctx.t - (cue._edellinen || ctx.t));
          cue._edellinen = ctx.t;
          kartta.etene(dt);
          kartta.piirra();
          paivitaAjoaika(juuri, ctx);
        } },

      /* 3 — Ajossa (purku 6). Reittiä seuraillaan. Määränpäätä ei näy —
             kortissa on vain kyydin nimi ja kulunut aika, kuten videossa. */
      { id: 3, nimi: 'Ajossa', sovellus: 'hopp',
        piirra: function (juuri, ctx) {
          var cue = this;
          cue._edellinen = 0;
          var d = kuori(juuri);
          karttaan(d, ctx, { reitti: 'matka', osuus: 'ajossa', liikkuu: true });
          tyokalu(d);
          var a = el('rydez-ala');
          a.appendChild(ajokortti(ctx));
          d.appendChild(a);
          sovitaAuto(d);
        },
        tick: function (juuri, ctx) {
          if (!kartta) return;
          var cue = this;
          var dt = Math.min(0.1, ctx.t - (cue._edellinen || ctx.t));
          cue._edellinen = ctx.t;
          kartta.etene(dt);
          kartta.piirra();
          paivitaAjoaika(juuri, ctx);
        } },

      /* 4 — Signaali katoaa (purku 6b). Kartta tyhjenee, jäljelle jää
             sykkivä sijaintipiste ja punainen ohje: KÄÄNNY YMPÄRI. */
      { id: 4, nimi: 'KÄÄNNY YMPÄRI', sovellus: 'hopp',
        hohto: { vari: 'punainen', voima: 3 },
        piirra: function (juuri, ctx) {
          var d = kuori(juuri);
          karttaan(d, ctx, { reitti: 'matka', osuus: 'metsatie', signaali: true });
          tyokalu(d);
          var H = ctx.S.hopp;
          d.appendChild(el('rydez-yla',
            sanamerkki(ctx) +
            '<div><div class="rydez-kaanny">' + H.kaannyTeksti + '</div>' +
            '<div class="rydez-kaanny-selite">' + H.eiSignaalia + '</div></div>'));
        },
        tick: function (juuri, ctx) {
          if (!kartta) return;
          kartta.signaaliAika = ctx.t;
          kartta.piirra();
        } },

      /* 5 — Uusi kyyti lähellä, hyvä provikka. Alvina painaa HYVÄKSY. */
      { id: 5, nimi: 'Uusi kyyti', sovellus: 'hopp',
        kosketus: true,
        piirra: function (juuri, ctx) {
          var cue = this;
          cue._hyvaksytty = false;
          var d = kuori(juuri);
          karttaan(d, ctx, { reitti: 'matka', osuus: 'metsatie' });
          tyokalu(d);

          var H = ctx.S.hopp, L = ctx.S.luvut;
          var a = el('rydez-ala');
          a.appendChild(tarjousKortti(ctx,
            { summa: L.provikka, nouto: ctx.e2(H.noutoEtaisyysKm) + ' km',
              matka: ctx.e2(H.matkanPituusKm) + ' km' },
            L.ajastinSekunnit));
          d.appendChild(a);
          sovitaAuto(d);

          d.addEventListener('hyvaksytty', function () {
            cue._hyvaksytty = true;
            var vanha = d.querySelector('.rydez-tarjous');
            if (vanha) vanha.remove();
            var ala = d.querySelector('.rydez-ala');
            ala.appendChild(vahvistusKortti(ctx));
            sovitaAuto(d);
          });
        },
        tick: function (juuri, ctx) {
          if (this._hyvaksytty) return;
          var kortti = juuri.querySelector('.rydez-tarjous');
          var L = ctx.S.luvut;
          if (kortti) paivitaTarjousAika(kortti, Math.max(0, L.ajastinSekunnit - ctx.t), L.ajastinSekunnit);
        } },

      { id: 6, nimi: 'Kameratesti', piirra: M.testikortti() }

    ]; }
  }).then(function () {
    /* Operaattorin karttanäppäimet. G X Y Z ovat glitchille, paikannin on L. */
    window.addEventListener('keydown', function (t) {
      if (!kartta || t.metaKey || t.ctrlKey || t.altKey) return;
      var n = t.key.toLowerCase(), askel = 70, kasitelty = true;
      switch (n) {
        case 'w': kartta.siirra(0, -askel); break;
        case 's': kartta.siirra(0, askel); break;
        case 'a': kartta.siirra(-askel, 0); break;
        case 'd': kartta.siirra(askel, 0); break;
        case 'q': kartta.zoom = Math.max(0.04, kartta.zoom / 1.3); break;
        case 'e': kartta.zoom = Math.min(4, kartta.zoom * 1.3); break;
        case 'c': kartta.keskitaAutoon(); break;
        case 'k': kartta.kaanny = !kartta.kaanny; break;
        case 'f': asetaNopeus(kartta.nopeus * 3.6 + 6); break;
        case 'j': asetaNopeus(kartta.nopeus * 3.6 - 6); break;
        case 'n': uusiKaupunki(); break;
        case 'm': tallennaNakyma(); break;
        case 'l': paikannin(); break;
        default: kasitelty = false;
      }
      if (!kasitelty) return;
      t.preventDefault();
      kartta.piirra();
      paivitaTyokalu();
    });
  });

  /* Ajonäkymän kortti: "Current ride" + kulunut aika. Aika alkaa
     sisalto.json:in arvosta (12:13) ja sekunnit juoksevat cue-ajasta —
     deterministinen otosta toiseen. */
  function ajokortti(ctx) {
    var H = ctx.S.hopp;
    var k = el('rydez-kortti');
    k.appendChild(el('rydez-ylarivi',
      '<span class="rydez-otsikko">' + H.ajoOtsikko + '</span>' + sanamerkki(ctx)));
    k.appendChild(el('rydez-aikarivi',
      '<span class="rydez-pilleri"></span>' +
      '<span class="rydez-aika" data-ajoaika>' + H.ajoAlku + '</span>'));
    return k;
  }

  function paivitaAjoaika(juuri, ctx) {
    var e = juuri.querySelector('[data-ajoaika]');
    if (!e) return;
    var osat = (ctx.S.hopp.ajoAlku || '12:13').split(':');
    var yht = (+osat[0]) * 60 + (+osat[1]) + Math.floor(ctx.t);
    var mm = Math.floor(yht / 60), ss = yht % 60;
    e.textContent = mm + ':' + (ss < 10 ? '0' : '') + ss;
  }

  /* ── Operaattorin työkalu ────────────────────────────────────────────── */
  function tyokalu(juuri) {
    var t = el('rydez-tyokalu');
    t.innerHTML =
      '<div class="rivi"><span>KARTTA</span><b id="rz-tila">–</b></div>' +
      '<div class="rivi"><span>siemen</span><b id="rz-siemen">–</b></div>' +
      '<div class="rivi"><span>zoom</span><b id="rz-zoom">–</b></div>' +
      '<div class="rivi"><span>nopeus</span><b id="rz-nopeus">–</b></div>' +
      '<div style="color:var(--himmea-2);line-height:1.6;margin-top:3px">' +
      'W A S D siirrä · Q E zoom<br>C keskitä · K käännä<br>' +
      'F nopeampi · J jarru<br>N uusi kaupunki · M tallenna<br>L paikannin</div>';
    juuri.appendChild(t);
    paivitaTyokalu();
    return t;
  }

  function paivitaTyokalu() {
    if (!kartta) return;
    var a = document.getElementById('rz-tila');
    if (!a) return;
    a.textContent = kartta.signaaliKadonnut ? 'EI SIGNAALIA'
      : kartta.gps ? 'paikannin' : (kartta.vapaa ? 'siirretty' : 'auto');
    document.getElementById('rz-siemen').textContent = kartta.asetukset.siemen;
    document.getElementById('rz-zoom').textContent = kartta.zoom.toFixed(2);
    document.getElementById('rz-nopeus').textContent = Math.round(kartta.nopeus * 3.6) + ' km/h';
  }

  function asetaNopeus(kmh) {
    kartta.nopeus = Math.max(0, Math.min(160, kmh)) / 3.6;
    GRIND.ilmoita('nopeus ' + Math.round(kartta.nopeus * 3.6) + ' km/h');
  }

  function uusiKaupunki() {
    var vanha = kartta.asetukset;
    var uusi = Math.floor(Math.random() * 99999);
    kartta = new GRIND.Kartta(kangas, {
      siemen: uusi, zoom: kartta.zoom, nopeusKmh: vanha.nopeusKmh,
      kadut: vanha.kadut, varit: vanha.varit, fontti: vanha.fontti
    });
    GRIND.kartta = kartta;
    GRIND.ilmoita('siemen ' + uusi);
  }

  function tallennaNakyma() {
    var n = {
      siemen: kartta.asetukset.siemen,
      zoom: Number(kartta.zoom.toFixed(3)),
      keskus: [Math.round(kartta.keskus.x), Math.round(kartta.keskus.y)],
      osuus: Number((kartta.matka / kartta.reitinPituus).toFixed(3)),
      tallennettu: new Date().toISOString().slice(0, 16)
    };
    var lista = [];
    try { lista = JSON.parse(localStorage.getItem('grind3-kartat') || '[]'); } catch (e) {}
    lista.push(n);
    try { localStorage.setItem('grind3-kartat', JSON.stringify(lista)); } catch (e) {}
    console.log('Kopioi sisalto.json → hopp.kartta.nakymat:\n' + JSON.stringify(lista, null, 2));
    GRIND.ilmoita('näkymä tallennettu · siemen ' + n.siemen + ' · ' + lista.length + ' kpl');
  }

  function paikannin() {
    var paalle = !kartta.gpsVahti;
    kartta.seuraaNopeus(paalle, function (viesti) {
      GRIND.ilmoita(viesti);
      paivitaTyokalu();
    });
  }
})();
</script>
