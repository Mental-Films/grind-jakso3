<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Alvina · tabletti">
<meta name="theme-color" content="#0E1116">
<link rel="apple-touch-icon" href="assets/ikoni_tabletti.png">
<link rel="manifest" href="manifest_tabletti.json">
<link rel="stylesheet" href="runko.css">
<link rel="stylesheet" href="glitch.css">
<link rel="stylesheet" href="candlr.css">
<link rel="stylesheet" href="grumbl.css">
<link rel="stylesheet" href="tabb.css">
<title>GRIND 3 — tabletti</title>
</head>
<body>
<script src="kaavio.js"></script>
<script src="nappaimisto.js"></script>
<script src="glitch.js"></script>
<script src="moottori.js"></script>
<script>
/* Alvinan iPad — CANDLR, GRUMBL, TABB.
 *
 * CANDLR on rakennettu (cuet 0, 4, 5, 6). GRUMBL ja TABB ovat vielä
 * paikkamerkeillä — vaiheet 4 ja 5.
 *
 * Rakenne on tarkistettu oikeasta pörssistä, ks. REFERENSSIT.md kohta 2.
 * Pystyasennossa välilehtipalkki, ei sivupalkkia: sivupalkki vaatii
 * vaakatilaa, jota 820 pt:n pystyruudussa ei ole.
 */
(function () {
  var kaavio = null, kangas = null, nappaimisto = null;

  function el(luokka, sisus) {
    var d = document.createElement('div');
    d.className = luokka;
    if (sisus != null) d.innerHTML = sisus;
    return d;
  }

  var K_TAHTI   = '<svg class="candlr-kuvake" viewBox="0 0 24 24"><path d="m12 17.3-6.2 3.7 1.6-7L2 9.2l7.1-.6L12 2l2.9 6.6 7.1.6-5.4 4.8 1.6 7z"/></svg>';
  var K_JAKO    = '<svg class="candlr-kuvake" viewBox="0 0 24 24"><path d="M18 16a3 3 0 0 0-2 .8l-7-4a3 3 0 0 0 0-1.6l7-4a3 3 0 1 0-1-2.2c0 .3 0 .5.1.8l-7 4a3 3 0 1 0 0 4.4l7 4a3 3 0 1 0 2.9-2.2z"/></svg>';
  var K_RAKETTI = '<svg class="candlr-raketti-kuvake" viewBox="0 0 24 24"><path d="M14 3c3.9 1 6.6 4.3 7 8.6-3.3 3.3-6.1 5-8.4 5.3l-2.5-2.5c.3-2.3 2-5.1 5.3-8.4zM8.3 15.7 6 18l-1.4-1.4 2.3-2.3zM4 20l2-2 1.4 1.4-2 2z"/></svg>';

  function nuoliMerkki(nousu) {
    return '<svg class="candlr-nuoli-pieni" viewBox="0 0 24 24">' +
      (nousu
        ? '<path d="M7 17 17 7M9 7h8v8"/><path d="M17 7 7 17l1.4 1.4L18.4 8.4V15h2V5h-10v2z"/>'
        : '<path d="M17 17H7V15h6.6L5.6 7l1.4-1.4 8 8V7h2z"/>') +
      '</svg>';
  }

  /* ── Välilehtipalkki ──────────────────────────────────────────────────── */
  var VALILEHTI_KUVAKKEET = [
    '<svg viewBox="0 0 24 24"><path d="M3 17h4v4H3zm7-8h4v12h-4zm7-6h4v18h-4z"/></svg>',
    '<svg viewBox="0 0 24 24"><path d="M3 5h18v4H3zm0 6h18v8H3z" opacity=".55"/><path d="M3 5h18v4H3z"/></svg>',
    '<svg viewBox="0 0 24 24"><path d="m12 3 4 5h-3v5h-2V8H8zm0 18-4-5h3v-5h2v5h3z"/></svg>',
    '<svg viewBox="0 0 24 24"><path d="M4 6h13a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H4zm12 6a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"/></svg>'
  ];

  function valilehdet(ctx) {
    var C = ctx.S.candlr;
    var v = el('candlr-valilehdet');
    C.valilehdet.forEach(function (nimi, i) {
      var t = el('candlr-valilehti' + (i === C.valilehtiValittu ? ' valittu' : ''),
        VALILEHTI_KUVAKKEET[i] + '<span>' + nimi + '</span>');
      v.appendChild(t);
    });
    return v;
  }

  /* ── Kaavio ───────────────────────────────────────────────────────────── */
  /* Kolme kurssitilaa: romahdus, raketti ja loppukuvan jyrkkä romahdus.
     Jokaisella oma kurssi, oma käyrän muoto ja oma asteikko. */
  function tila(ctx, asetukset) {
    var L = ctx.S.luvut;
    if (asetukset.nousu) {
      return { suunta: 'nousu', nousu: true, kurssi: L.rprKurssiHuippu,
               muutosEur: L.rprMuutosEurNousu, muutos: L.rprMuutosNousu,
               ylin: L.rprKurssiHuippu * 1.12, alin: L.rprKurssi * 0.85 };
    }
    if (asetukset.loppu) {
      return { suunta: 'lasku-jyrkka', nousu: false, kurssi: L.rprKurssiLoppu,
               muutosEur: L.rprMuutosEurLoppu, muutos: L.rprMuutosLoppu,
               ylin: L.rprKurssiHuippu * 1.1, alin: 0 };
    }
    return { suunta: 'lasku', nousu: false, kurssi: L.rprKurssi,
             muutosEur: L.rprMuutosEur, muutos: L.rprMuutos,
             ylin: L.rprKurssi * 2.1, alin: L.rprKurssi * 0.92 };
  }

  function kaavioon(juuri, ctx, T) {
    var C = ctx.S.candlr, L = ctx.S.luvut;
    var kehys = el('candlr-kaavio');

    if (!kangas) { kangas = document.createElement('canvas'); }
    if (!kaavio) {
      kaavio = new GRIND.Kaavio(kangas, {
        siemen: 331,
        varit: Object.assign({}, ctx.T.varit, {
          lasku: ctx.T.varit.virhe, nousu: ctx.T.varit.ok,
          ruudukko: ctx.T.varit.viiva, asteikko: ctx.T.varit['himmea-2'],
          pohja: ctx.T.varit.pohja
        }),
        fontti: 'ui-monospace, monospace',
        ajat: C.ajat
      });
      GRIND.kaavio = kaavio;
    }
    /* Asteikko oikeassa laidassa, kuten pörsseissä: tuorein hinta on
       kaavion oikeassa reunassa. */
    kaavio.a.asteikko = function (osuus) {
      return ctx.eD(T.ylin - (T.ylin - T.alin) * osuus, 4);
    };
    kaavio.a.nykyhinta = function () { return ctx.eD(T.kurssi, 4); };
    kaavio.asetaSuunta(T.suunta);
    kehys.appendChild(kangas);

    /* Vilkkuvat miinusmerkit ja tappioluvut. Paikat siemennetystä
       satunnaisluvusta, joten ne ovat joka otossa samat. */
    if (!T.nousu) {
      var r = ctx.rnd;
      var t = el('candlr-tappiot');
      C.tappiot.forEach(function (teksti, i) {
        var s = document.createElement('span');
        s.className = 'candlr-tappio';
        s.textContent = teksti;
        s.style.left = (6 + r() * 74) + '%';
        s.style.top = (8 + r() * 74) + '%';
        s.style.fontSize = (teksti === '−' ? 34 : 17 + r() * 9).toFixed(0) + 'px';
        s.style.animationDelay = (r() * 2.4).toFixed(2) + 's';
        t.appendChild(s);
      });
      kehys.appendChild(t);
    }

    juuri.appendChild(kehys);
    requestAnimationFrame(function () { kaavio.piirra(0); });
    setTimeout(function () { kaavio.piirra(0); }, 120);
    return kehys;
  }

  /* ── CANDLR-perusnäkymä ───────────────────────────────────────────────── */
  function candlr(juuri, ctx, asetukset) {
    var C = ctx.S.candlr, L = ctx.S.luvut;
    var T = tila(ctx, asetukset);
    var nousu = T.nousu;

    var d = el('candlr');
    var sisus = el('candlr-sisus');

    /* Yläpalkki */
    var yla = el('candlr-yla');
    var tunnus = el('candlr-tunnus', '<span>' + C.tunnus.charAt(0) + '</span>');
    var kuva = new Image();
    kuva.onload = function () { tunnus.innerHTML = ''; tunnus.appendChild(kuva); };
    kuva.src = 'assets/rpr_tunnus.svg';
    yla.appendChild(tunnus);
    yla.appendChild(el('', '<span class="candlr-nimi">' + ctx.nimi('reapercoin') +
      '</span><span class="candlr-lyhenne">' + C.tunnus + '</span>'));
    var ylaoikea = el('candlr-ylaoikea', K_TAHTI + K_JAKO);
    ylaoikea.appendChild(el('candlr-valuutta', C.valuutta + ' ▾'));
    yla.appendChild(ylaoikea);
    sisus.appendChild(yla);

    /* Kurssi, muutos ja aikavälipillerit samalla rivillä */
    var rivi = el('candlr-kurssirivi');
    var vasen = el('');
    vasen.appendChild(el('candlr-kurssi', ctx.eD(T.kurssi, 4) + ' €'));
    vasen.appendChild(el('candlr-muutos ' + (nousu ? 'nousu' : 'lasku'),
      nuoliMerkki(nousu) +
      '<span>' + ctx.eD(Math.abs(T.muutosEur), 4) + ' €</span>' +
      '<span class="candlr-suluissa">(' + (nousu ? '+' : '−') +
        ctx.e1(Math.abs(T.muutos)) + ' %)</span>'));
    rivi.appendChild(vasen);

    var valit = el('candlr-valit');
    C.aikavalit.forEach(function (v) {
      var b = document.createElement('button');
      b.className = 'candlr-vali' + (v === C.aikavaliValittu ? ' valittu' : '');
      b.textContent = v;
      valit.appendChild(b);
    });
    rivi.appendChild(valit);
    sisus.appendChild(rivi);

    /* Banneri tulee riviin kurssin JÄLKEEN, ei sen päälle. Kurssi on
       kohtauksen luettava luku eikä sitä saa peittää. */
    if (asetukset.banneri) sisus.appendChild(banneri(ctx));

    kaavioon(sisus, ctx, T);

    /* Salkku. Arvo lasketaan omistuksesta ja kurssista, tuotto siitä ja
       sijoitetusta summasta. Mikään näistä ei ole erikseen kirjattu luku,
       joten ne eivät voi ajautua ristiriitaan keskenään. */
    var salkkuArvo = L.omistus * T.kurssi;
    var tulos = salkkuArvo - L.sijoitettu;
    var tulosPros = (tulos / L.sijoitettu) * 100;
    var salkku = el('candlr-salkku');
    salkku.appendChild(el('',
      '<div class="candlr-salkku-otsikko">' + C.salkkuOtsikko + '</div>' +
      '<div class="candlr-salkku-arvo">' + ctx.e0(salkkuArvo) + ' €</div>'));
    /* Oikealla salkun oma tuotto, ei kolikon vuorokausimuutos. Ne ovat eri
       asia: kurssi voi raketoida ja salkku olla silti tappiolla. */
    salkku.appendChild(el('candlr-salkku-oikea',
      '<div class="candlr-salkku-otsikko">' + C.otsikko + '</div>' +
      '<div class="candlr-muutos ' + (tulos >= 0 ? 'nousu' : 'lasku') +
        '" style="margin-top:2px;justify-content:flex-end">' +
      nuoliMerkki(tulos >= 0) + '<span>' + (tulos >= 0 ? '+' : '−') +
        ctx.e1(Math.abs(tulosPros)) + ' %</span></div>'));
    sisus.appendChild(salkku);

    /* Oma positio. Tappio johdetaan salkun luvuista, jottei se voi
       ajautua ristiriitaan niiden kanssa. */
    var positio = el('candlr-positio');
    positio.appendChild(el('candlr-positio-rivi',
      '<span>' + C.positioOtsikko + '</span><b>' + ctx.e2(L.omistus) + ' ' + C.tunnus + '</b>'));
    positio.appendChild(el('candlr-positio-rivi',
      '<span>' + C.ostohintaOtsikko + '</span><b>' +
      ctx.eD(L.sijoitettu / L.omistus, 4) + ' €</b>'));
    positio.appendChild(el('candlr-positio-rivi',
      '<span>' + C.tulosOtsikko + '</span><b class="' + (tulos >= 0 ? 'nousu' : 'lasku') + '">' +
      (tulos >= 0 ? '+' : '−') + ctx.e0(Math.abs(tulos)) + ' €</b>'));
    sisus.appendChild(positio);

    /* Tunnusluvut, kolme saraketta */
    var arvot = [C.marketCap, C.volyymi, C.huippu];
    var luvut = el('candlr-luvut');
    C.luvutOtsikot.forEach(function (otsikko, i) {
      luvut.appendChild(el('candlr-luku',
        '<span>' + otsikko + '</span><b>' + arvot[i] + '</b>'));
    });
    sisus.appendChild(luvut);

    d.appendChild(sisus);

    /* Osto ja myynti */
    var toiminnot = el('candlr-toiminnot');
    var osta = document.createElement('button');
    osta.className = 'candlr-nappi candlr-osta';
    osta.textContent = C.ostaNappi;
    /* BUY avaa ostoarkin, kuten oikeassa sovelluksessa. Cuessa 4 tämä on
       se, mitä Alvina painaa bannerin jälkeen — ja arkki paljastaa 3,31 €. */
    osta.addEventListener('click', function () {
      if (d.querySelector('.candlr-osto-arkki')) return;
      d.appendChild(ostoArkki(ctx));
    });
    var myy = document.createElement('button');
    myy.className = 'candlr-nappi candlr-myy';
    myy.textContent = C.myyNappi;
    toiminnot.appendChild(osta);
    toiminnot.appendChild(myy);
    d.appendChild(toiminnot);
    d.appendChild(valilehdet(ctx));

    if (asetukset.osto) d.appendChild(ostoArkki(ctx));

    juuri.appendChild(d);
    return d;
  }

  /* Huijausmainen ilmoitus. Suunniteltu sen näköiseksi. */
  function banneri(ctx) {
    var C = ctx.S.candlr;
    var b = el('candlr-banneri', K_RAKETTI +
      '<div class="candlr-banneri-teksti">' + C.rakettiBanneri + '</div>');
    var n = document.createElement('button');
    n.className = 'candlr-banneri-nappi';
    n.textContent = C.rakettiNappi;
    b.appendChild(n);
    return b;
  }

  /* Cue 5. Banneri käskee ostaa — ja tilillä on 3,31 €. */
  function ostoArkki(ctx) {
    var C = ctx.S.candlr, L = ctx.S.luvut;
    var arkki = el('candlr-osto-arkki');
    var kortti = el('candlr-osto-kortti');

    kortti.appendChild(el('candlr-osto-otsikko',
      '<span>' + C.ostoOtsikko + '</span>'));
    kortti.appendChild(el('candlr-maara', C.ostoMaara + ' €'));
    kortti.appendChild(el('candlr-maara-vastine',
      '0,0000 ' + C.tunnus + '  ·  ' + ctx.eD(L.rprKurssiHuippu, 4) + ' € / ' + C.tunnus));

    var kate = el('candlr-kate',
      '<div class="candlr-kate-otsikko">' + C.kateOtsikko + '</div>' +
      '<div class="candlr-kate-arvo">' + ctx.e2(L.kate) + ' €</div>');
    kortti.appendChild(kate);

    var v = document.createElement('button');
    v.className = 'candlr-osto-vahvista';
    v.textContent = C.vahvistaNappi;
    v.disabled = true;
    kortti.appendChild(v);
    kortti.appendChild(el('candlr-varoitus', C.eiKatetta));

    arkki.appendChild(kortti);
    return arkki;
  }

  /* ══ GRUMBL — keskustelupalsta ══════════════════════════════════════════
     GRUMBL ei ole sovellus vaan selaimessa auki oleva sivusto: vasen
     navigaatio, keskellä sisältö, oikealla yhteisön tiedot ja säännöt.
     iPadin Safari pyytää työpöytäsivut oletuksena, joten juuri tämän Alvina
     näkisi — mobiiliasettelu olisi väärä referenssi. */

  var K_HAKU   = '<svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 1 0 4.9 14.3l5.4 5.4 1.4-1.4-5.4-5.4A8 8 0 0 0 10 2zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12z"/></svg>';
  var K_KOTI   = '<svg viewBox="0 0 24 24"><path d="M12 3 3 11h2v9h5v-6h4v6h5v-9h2z"/></svg>';
  var K_SUOSIO = '<svg viewBox="0 0 24 24"><path d="M4 20h4v-7H4zm6 0h4V7h-4zm6 0h4V10h-4z"/></svg>';
  var K_UUTIS  = '<svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zm2 3v3h7V7zm9 0v3h3V7zM6 12v2h12v-2zm0 4v2h12v-2z"/></svg>';
  var K_TUTKI  = '<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm3.5 6.5-2 5-5 2 2-5z"/></svg>';
  var K_PLUS   = '<svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>';
  var K_LUO    = '<svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zm7 3v4H7v2h4v4h2v-4h4v-2h-4V7z"/></svg>';
  var K_PUHE   = '<svg viewBox="0 0 24 24"><path d="M4 4h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-5 4V6a2 2 0 0 1 0-2z"/></svg>';
  var K_KELLO  = '<svg viewBox="0 0 24 24"><path d="M12 2a6 6 0 0 0-6 6v4l-2 3v2h16v-2l-2-3V8a6 6 0 0 0-6-6zm0 20a3 3 0 0 0 3-3H9a3 3 0 0 0 3 3z"/></svg>';
  var K_MAINOS = '<svg viewBox="0 0 24 24"><path d="M3 5h18v14H3zm3 3v8h3l4 3V5L9 8z"/></svg>';
  var K_NUOLI  = '<svg viewBox="0 0 24 24"><path d="m8 10 4 4 4-4z"/></svg>';
  var K_KIRJE  = '<svg viewBox="0 0 24 24"><path d="M3 5h18v14H3zm2 2v.5l7 4.5 7-4.5V7z"/></svg>';
  var K_KUVA   = '<svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zm2 10 3-4 2 3 3-4 4 5z"/></svg>';
  var K_VIDEO  = '<svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm-2 5 6 4-6 4z"/></svg>';

  function grumbl(juuri, ctx) {
    var G = ctx.S.grumbl;
    var d = el('grumbl');

    /* ── Yläpalkki ─────────────────────────────────────────────────────── */
    var yla = el('grumbl-ylapalkki');
    yla.appendChild(el('grumbl-logo',
      '<span class="grumbl-logo-merkki">' + G.alueMerkki.charAt(0) + '</span>' +
      '<span>' + ctx.nimi('grumbl').toLowerCase() + '</span>'));

    yla.appendChild(el('grumbl-haku',
      K_HAKU +
      '<span class="grumbl-haku-siru"><b>R</b>' + G.alue + '<span>×</span></span>' +
      '<span class="grumbl-haku-vihje">' + G.hakuvihje + '</span>'));

    var toiminnot = el('grumbl-ylatoiminnot');
    toiminnot.innerHTML =
      K_MAINOS.replace('<svg', '<svg class="grumbl-ylakuvake"') +
      K_PUHE.replace('<svg', '<svg class="grumbl-ylakuvake"') +
      '<span class="grumbl-luo">' + K_LUO.replace('<svg', '<svg class="grumbl-ylakuvake"') +
        G.luoNappi + '</span>' +
      '<span class="grumbl-kello">' + K_KELLO.replace('<svg', '<svg class="grumbl-ylakuvake"') +
        '<span class="grumbl-merkkiluku">1</span></span>' +
      '<span class="grumbl-avatar">A</span>';
    yla.appendChild(toiminnot);
    d.appendChild(yla);

    var runko = el('grumbl-runko');

    /* ── Vasen navigaatio ──────────────────────────────────────────────── */
    var vasen = el('grumbl-vasen');
    var naviKuvakkeet = [K_KOTI, K_SUOSIO, K_UUTIS, K_TUTKI, K_PLUS];
    G.navi.forEach(function (nimi, i) {
      vasen.appendChild(el('grumbl-navi-rivi' + (i === 0 ? ' valittu' : ''),
        naviKuvakkeet[i] + '<span>' + nimi + '</span>'));
    });

    var pelivarit = ['var(--linkki)', 'var(--varoitus)', 'var(--grumbl)', 'var(--virhe)'];
    vasen.appendChild(el('grumbl-osasto', G.peliotsikko + K_NUOLI.replace('<svg', '<svg style="width:12px;height:12px;fill:currentColor;margin-left:auto"')));
    G.pelit.forEach(function (peli, i) {
      var r = el('grumbl-pikkurivi', '<span>' + peli + '</span>');
      var m = el('grumbl-pikkumerkki', peli.charAt(0));
      m.style.background = pelivarit[i % pelivarit.length];
      r.insertBefore(m, r.firstChild);
      vasen.appendChild(r);
    });

    vasen.appendChild(el('grumbl-osasto', G.syoteOtsikko));
    vasen.appendChild(el('grumbl-pikkurivi',
      K_PLUS.replace('<svg', '<svg style="width:16px;height:16px;fill:currentColor;flex:none"') +
      '<span>' + G.syoteLuo + '</span>'));
    vasen.appendChild(el('grumbl-osasto', G.yhteisoOtsikko));
    runko.appendChild(vasen);

    /* ── Keskipalsta: kirjoituslomake ──────────────────────────────────── */
    var keski = el('grumbl-keski');
    keski.appendChild(el('grumbl-lomake-otsikko',
      '<span style="margin-left:0">' + G.kirjoitaOtsikko + '</span>' +
      '<span>' + G.alue + '</span>'));

    var valilehdet = el('grumbl-valilehdet');
    ['Text', 'Images', 'Link', 'Poll'].forEach(function (v, i) {
      valilehdet.appendChild(el('grumbl-valilehti' + (i === 0 ? ' valittu' : ''), v));
    });
    keski.appendChild(valilehdet);

    var otsikkoKentta = el('grumbl-kentta aktiivinen');
    otsikkoKentta.appendChild(el('grumbl-kentta-nimi', G.otsikkoKentta.toUpperCase()));
    var teksti = el('grumbl-teksti');
    teksti.setAttribute('data-vihje', G.otsikkoVihje);
    otsikkoKentta.appendChild(teksti);
    var tyokalut = el('grumbl-tyokalut', K_KUVA + K_VIDEO +
      '<span style="font-family:var(--fontti-mono);font-size:11px;color:var(--himmea-2)">GIF</span>' +
      '<span style="font-size:13px;color:var(--himmea-2)">Aa</span>');
    var laskuri = el('grumbl-laskuri', '0 / 300');
    tyokalut.appendChild(laskuri);
    otsikkoKentta.appendChild(tyokalut);
    keski.appendChild(otsikkoKentta);

    var runkoKentta = el('grumbl-kentta');
    runkoKentta.appendChild(el('grumbl-kentta-nimi', 'BODY'));
    runkoKentta.appendChild(el('grumbl-runkokentta', G.runkoVihje));
    keski.appendChild(runkoKentta);

    var napit = el('grumbl-lomake-napit');
    var peruuta = document.createElement('button');
    peruuta.className = 'grumbl-peruuta';
    peruuta.textContent = G.peruutaNappi;
    var julkaise = document.createElement('button');
    julkaise.className = 'grumbl-julkaise';
    julkaise.textContent = G.julkaisuNappi;
    napit.appendChild(peruuta);
    napit.appendChild(julkaise);
    keski.appendChild(napit);

    var muistutus = el('grumbl-muistutus');
    muistutus.appendChild(el('grumbl-muistutus-otsikko', G.muistutusOtsikko));
    G.muistutukset.forEach(function (rivi) {
      muistutus.appendChild(el('grumbl-muistutus-rivi', '<i>•</i><span>' + rivi + '</span>'));
    });
    keski.appendChild(muistutus);
    runko.appendChild(keski);

    /* ── Oikea palsta: yhteisön tiedot ja säännöt ──────────────────────── */
    var oikea = el('grumbl-oikea');
    oikea.appendChild(el('grumbl-opas',
      K_UUTIS.replace('<svg', '<svg style="width:14px;height:14px;fill:currentColor"') + G.oppaat));
    oikea.appendChild(el('grumbl-tilastot',
      '<div class="grumbl-tilasto"><b>' + G.kavijat + '</b><span>' + G.kavijatOtsikko + '</span></div>' +
      '<div class="grumbl-tilasto"><b>' + G.osallistumiset + '</b><span>' + G.osallistumisetOtsikko + '</span></div>'));

    var liputus = el('grumbl-lohko');
    liputus.appendChild(el('grumbl-lohko-otsikko', G.kayttajaOtsikko));
    liputus.appendChild(el('grumbl-liputus',
      '<span class="grumbl-liputus-merkki">A</span><span>' + G.kayttajaNimi + '</span>'));
    oikea.appendChild(liputus);

    var saannot = el('grumbl-lohko');
    saannot.appendChild(el('grumbl-lohko-otsikko', G.saannotOtsikko));
    G.saannot.forEach(function (teksti2, i) {
      saannot.appendChild(el('grumbl-saanto',
        '<i>' + (i + 1) + '</i><span>' + teksti2 + '</span>' + K_NUOLI));
    });
    oikea.appendChild(saannot);

    var modet = el('grumbl-lohko');
    modet.appendChild(el('grumbl-lohko-otsikko', G.modeOtsikko));
    modet.appendChild(el('grumbl-mode-nappi',
      K_KIRJE.replace('<svg', '<svg style="width:14px;height:14px;fill:currentColor"') + G.viestiModeille));
    modet.appendChild(el('grumbl-mode',
      '<span class="grumbl-mode-kuva"></span>' +
      '<span class="grumbl-mode-nimi">' + G.moderaattori + '</span>' +
      '<span class="grumbl-mode-merkki">' + G.moderaattoriMerkki + '</span>'));
    modet.appendChild(el('grumbl-mode-nappi', G.kaikkiModet));
    oikea.appendChild(modet);

    oikea.appendChild(el('grumbl-alatunniste', G.alatunniste.join(' &nbsp; ')));
    runko.appendChild(oikea);
    d.appendChild(runko);

    /* ── Näppäimistö ───────────────────────────────────────────────────────
       Mikä tahansa näppäin vie käsikirjoituksen tekstiä eteenpäin, joten
       näyttelijän ei tarvitse osua oikeisiin näppäimiin. */
    nappaimisto = new GRIND.Nappaimisto({
      teksti: G.postausOtsikko,
      virhe: G.kirjoitusvirhe,
      onMuutos: function (arvo) {
        teksti.innerHTML = arvo.replace(/&/g, '&amp;').replace(/</g, '&lt;') +
          '<span class="grumbl-kohdistin"></span>';
        laskuri.textContent = arvo.length + ' / 300';
        julkaise.classList.toggle('aktiivinen', arvo.length > 0);
      }
    });
    teksti.innerHTML = '<span class="grumbl-kohdistin"></span>';
    d.appendChild(nappaimisto.el);

    juuri.appendChild(d);
  }

  /* ══ TABB — osta nyt, maksa myöhemmin ═══════════════════════════════════
     Rivi on maksusuunnitelma eikä lasku: siinä näkyy erälaskuri ja yhden
     erän summa. Ks. REFERENSSIT.md kohta 4. */

  var TABB_KUVAKKEET = [
    '<svg viewBox="0 0 24 24"><path d="M4 5h16v3H4zm0 5h16v9H4zm3 3h6v2H7z"/></svg>',
    '<svg viewBox="0 0 24 24"><path d="M7 4h10l1 3H6zm-2 5h14l-1 11H6zm4 3v6h2v-6zm4 0v6h2v-6z"/></svg>',
    '<svg viewBox="0 0 24 24"><path d="M4 6h13a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H4zm12 6a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"/></svg>',
    '<svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm0 2c-4 0-7 2-7 4.5V21h14v-2.5C19 16 16 14 12 14z"/></svg>'
  ];

  /* Erääntynyt yhteensä lasketaan riveistä: maksamattomat erät niiltä
     riveiltä, jotka ovat erääntyneet. Aiemmin tämä oli oma lukunsa
     sisalto.json:issa eikä täsmännyt riveihin. */
  function eraantynytYhteensa(rivit) {
    return rivit.reduce(function (summa, r) {
      if (r.tila !== 'eraantynyt') return summa;
      return summa + (r.summa / r.erat) * (r.erat - r.maksettu);
    }, 0);
  }

  function tabb(juuri, ctx) {
    var T = ctx.S.tabb, L = ctx.S.luvut;
    var d = el('tabb');
    var sisus = el('tabb-sisus');

    var yla = el('tabb-yla');
    yla.appendChild(el('tabb-merkki', ctx.nimi('tabb')));
    yla.appendChild(el('tabb-profiili', T.profiili));
    sisus.appendChild(yla);

    var kortti = el('tabb-kortti');
    kortti.appendChild(el('tabb-kortti-otsikko', T.yhteensaOtsikko));
    kortti.appendChild(el('tabb-summa', ctx.e2(eraantynytYhteensa(T.rivit)) + ' €'));
    kortti.appendChild(el('tabb-kortti-rivi',
      '<span>' + T.maksuOtsikko + '</span><b>' + ctx.e2(L.myohastymismaksu) + ' €</b>'));
    sisus.appendChild(kortti);

    sisus.appendChild(el('tabb-osio',
      '<span style="margin-left:0">' + T.osioOtsikko + '</span><span>' + T.osioMaara + '</span>'));

    var lista = el('tabb-lista');
    T.rivit.forEach(function (r) {
      var rivi = el('tabb-rivi');

      /* Kauppiaan merkki: SVG jos graafikko on toimittanut, muuten nimen
         kaksi ensimmäistä kirjainta. */
      var nimi = ctx.nimi(r.kauppias);
      var merkki = el('tabb-kauppias', nimi.slice(0, 2));
      var kuva = new Image();
      kuva.onload = function () { merkki.innerHTML = ''; merkki.appendChild(kuva); };
      kuva.src = 'assets/kauppias_' + r.kauppias + '.svg';
      rivi.appendChild(merkki);

      var erat = '';
      for (var i = 0; i < r.erat; i++) {
        erat += '<div class="tabb-era' +
          (i < r.maksettu ? ' maksettu' : (r.tila === 'eraantynyt' ? ' myohassa' : '')) + '"></div>';
      }
      rivi.appendChild(el('tabb-tiedot',
        '<div class="tabb-tuote">' + nimi + ' · ' + r.tuote + '</div>' +
        '<div class="tabb-erarivi"><div class="tabb-erat">' + erat + '</div>' +
        '<span>' + r.maksettu + ' / ' + r.erat + '</span></div>'));

      rivi.appendChild(el('tabb-oikea',
        '<div class="tabb-erasumma">' + ctx.e2(r.summa / r.erat) + ' €</div>' +
        '<div class="tabb-erapaiva">' + r.erapaiva + '</div>'));

      var merkinnat = { eraantynyt: T.eraantynytMerkki, avoin: T.avoinMerkki, maksettu: T.maksettuMerkki };
      rivi.appendChild(el('tabb-tila ' + r.tila, merkinnat[r.tila]));
      lista.appendChild(rivi);
    });
    sisus.appendChild(lista);
    d.appendChild(sisus);

    var maksa = document.createElement('button');
    maksa.className = 'tabb-maksa';
    maksa.textContent = T.maksaNappi;
    d.appendChild(maksa);

    var valilehdet = el('tabb-valilehdet');
    T.valilehdet.forEach(function (n, i) {
      valilehdet.appendChild(el('tabb-valilehti' + (i === T.valilehtiValittu ? ' valittu' : ''),
        TABB_KUVAKKEET[i] + '<span>' + n + '</span>'));
    });
    d.appendChild(valilehdet);

    juuri.appendChild(d);
  }

  /* Kaavio elää cue-suhteellisen ajan mukaan, joten se toistuu otosta toiseen. */
  function kaavioTick(juuri, ctx) {
    if (kaavio && juuri.querySelector('.candlr-kaavio')) kaavio.piirra(ctx.t);
  }

  /* ══ Cuet ═══════════════════════════════════════════════════════════════ */
  GRIND.kaynnista({
    laite: 'tabletti',
    cuet: function (M) { return [

      /* 0 — Reapercoin romahtaa. Sahalaita lävistää asteikon diagonaalisesti. */
      { id: 0, nimi: 'Romahdus', sovellus: 'candlr',
        hohto: { vari: 'punainen', voima: 6 },
        piirra: function (juuri, ctx) { candlr(juuri, ctx, {}); },
        tick: kaavioTick },

      /* 1 — GRUMBL. Kirjoitusnäkymä auki: Alvina naputtelee otsikon.
             Mikä tahansa näppäin vie tekstiä eteenpäin, joten hän saa
             kirjoittaa luontevasti ja katsoa ylös kesken lauseen. */
      { id: 1, nimi: 'Postaus', sovellus: 'grumbl',
        kosketus: true,
        hohto: { vari: 'punainen', voima: 3 },
        piirra: function (juuri, ctx) { grumbl(juuri, ctx); } },

      /* 2 — TABB. Puhelin, takki ja neljä ruokatilausta, valtaosa
             erääntynyt. Luettava asia on ERÄÄNTYNYT-merkinnät, ei summat. */
      { id: 2, nimi: 'Ostosrivit', sovellus: 'tabb',
        hohto: { vari: 'punainen', voima: 3 },
        piirra: function (juuri, ctx) { tabb(juuri, ctx); } },

      /* 3 — Lepotila. */
      { id: 3, nimi: 'Lepotila',
        hohto: null,
        piirra: M.paikkamerkki({
          otsikko: 'Lepotila',
          kuvaus: 'Musta ruutu. Ottojen väliin ja kohtiin, joissa Alvina nukkuu.'
        }) },

      /* 4 — Raketti. Käyrä vihreänä ja huijausmainen banneri päällä. */
      { id: 4, nimi: 'Raketti', sovellus: 'candlr',
        hohto: { vari: 'vihrea', voima: 6 },
        piirra: function (juuri, ctx) { candlr(juuri, ctx, { nousu: true, banneri: true }); },
        tick: kaavioTick },

      /* 5 — Kate 3,31 €. Banneri käski ostaa; tilillä ei ole millä. */
      { id: 5, nimi: 'Kate 3,31 €', sovellus: 'candlr',
        hohto: { vari: 'vihrea', voima: 4 },
        piirra: function (juuri, ctx) {
          candlr(juuri, ctx, { nousu: true, osto: true });
        },
        tick: kaavioTick },

      /* 6 — Loppukuva. Pumppaus romahti, punainen palaa kasvoille. */
      /* 6 — Loppukuva. Pumppaus petti: jyrkkä romahdus, eri käyrän muoto
             kuin cue 0. Punainen palaa kasvoille. */
      { id: 6, nimi: 'Loppukuva', sovellus: 'candlr',
        hohto: { vari: 'punainen', voima: 7 },
        piirra: function (juuri, ctx) { candlr(juuri, ctx, { loppu: true }); },
        tick: kaavioTick },

      { id: 7, nimi: 'Kameratesti', piirra: M.testikortti() }

    ]; }
  }).then(function () {
    /* Operaattorin lisänäppäin: A kirjoittaa postauksen itsestään, jos
       ohjaaja haluaa tekstin ilmestyvän ilman näyttelijän kosketusta.
       Sama näppäin pysäyttää, ⇧A nollaa kentän uutta ottoa varten. */
    window.addEventListener('keydown', function (t) {
      if (t.metaKey || t.ctrlKey || t.altKey) return;
      if (t.key.toLowerCase() !== 'a' || !nappaimisto) return;
      t.preventDefault();
      if (t.shiftKey) { nappaimisto.nollaa(); GRIND.ilmoita('kenttä tyhjennetty'); return; }
      if (nappaimisto.automaatti) { nappaimisto.automaattiPois(); GRIND.ilmoita('automaattikirjoitus pois'); }
      else { nappaimisto.automaattiPaalle(7); GRIND.ilmoita('automaattikirjoitus päällä'); }
    });
  });
})();
</script>
</body>
</html>
